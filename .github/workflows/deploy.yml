name: Deploy to VPS

# main'e her push'ta (ve elle tetiklemeyle):
#   1) build: GitHub'ın runner'ında api/web/landing image'ları derlenip GHCR'ye itilir.
#   2) deploy: VPS'teki self-hosted runner image'ları ÇEKER ve compose up yapar (sunucuda derleme YOK).
# Neden: sunucuda build 18 GB cache biriktiriyordu ve küçük (2 GB RAM) kutuda OOM riski yaratıyordu.
# Runner VPS'te çalışır → GitHub'a DIŞARI bağlanır (inbound SSH YOK; yurtdışı IP'lerden
# SSH'ın düşürülmesi / fail2ban-geo sorunu bu modelde yaşanmaz).
on:
  push:
    branches: [main]
    # Yalnız belge değişen push'ta deploy yok (hiçbir imaj .md okumuyor). Commit'te
    # tek bir kod dosyası bile varsa deploy normal çalışır. Elle tetikleme her zaman açık.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'contracts/**'
  workflow_dispatch: {}

# Aynı anda tek deploy çalışsın.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # web: context kök (E1 §6.1: ../shared/e2ee-core imaja girmeli); api ve landing aynen ./<servis>.
        include:
          - service: api
            context: ./api
            file: ./api/Dockerfile
          - service: web
            context: .
            file: ./web/Dockerfile
          - service: landing
            context: ./landing
            file: ./landing/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/batuhanars/kankaverse-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/batuhanars/kankaverse-${{ matrix.service }}:latest
          # web: VITE_API_URL prod'da boş (same-origin, Caddy /api'yi proxy'ler). Diğerleri arg'ı yok sayar.
          build-args: |
            VITE_API_URL=
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: read
    steps:
      # actions/checkout YOK — mevcut klon üzerinde çalışıyoruz
      # (.env.production orada; runner'ın _work klasörüne checkout istemiyoruz).
      - name: Deploy (git pull + image pull + compose up)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          cd /home/deploy/kankaverse
          # D98: disk doluluk kapısı. Pull'dan ÖNCE ölç; eşik üstündeyse güvenli temizlik dene,
          # hâlâ doluysa deploy'u durdur (mevcut servisler çalışmaya devam eder, yarım deploy olmaz).
          DISK_LIMIT=85
          disk_pct() { df --output=pcent / | tail -1 | tr -dc '0-9'; }
          # Konteynerlerin (çalışan/duran) kullandığı imaj + servis başına en yeni 3 sha etiketi
          # dışındaki api/web/landing imajlarını sil. postgres/redis/caddy'ye dokunulmaz.
          cleanup_old_images() {
            USED=$(docker ps -aq | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null | sort -u || true)
            for SVC in api web landing; do
              REPO="ghcr.io/batuhanars/kankaverse-$SVC"
              docker image ls "$REPO" --format '{{.Repository}}:{{.Tag}}' 2>/dev/null \
                | grep -v -e ':<none>$' -e ':latest$' \
                | while read -r REF; do
                    docker image inspect --format '{{.Created}} {{.Id}} '"$REF" "$REF" 2>/dev/null || true
                  done \
                | sort -r | tail -n +4 \
                | while read -r _ ID REF; do
                    if echo "$USED" | grep -qx "$ID"; then continue; fi
                    docker rmi "$REF" || true
                  done || true
            done
          }
          PCT=$(disk_pct)
          echo "Disk doluluğu (deploy öncesi): %$PCT"
          if [ "$PCT" -gt "$DISK_LIMIT" ]; then
            echo "Eşik aşıldı, güvenli temizlik yapılıyor"
            docker builder prune -af || true
            docker image prune -f || true
            cleanup_old_images || true
            PCT=$(disk_pct)
            echo "Disk doluluğu (temizlik sonrası): %$PCT"
            if [ "$PCT" -gt "$DISK_LIMIT" ]; then
              df -h /
              echo "::error::Disk doluluğu %$PCT (eşik %$DISK_LIMIT). Deploy durduruldu; mevcut servisler çalışmaya devam ediyor. Sunucuda elle yer aç (docker system df)."
              exit 1
            fi
          fi
          # 2026-11-12: sunucudan GitHub'a (140.82.121.x) bağlantılar aralıklı kopuyor; tek kopukluk
          # deploy'u düşürüyordu. Ağ adımları 5 kez denenir (yarım inen imaj katmanları korunur).
          retry() {
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::Deneme $n düştü: $*  (15 sn sonra tekrar)"
              sleep 15
            done
            return 1
          }
          ghcr_login() { echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin; }
          BEFORE=$(git rev-parse HEAD)
          # Repo private: https remote anonim pull edemiyor. Token'ı geçici Authorization
          # header'ı ile ver (URL'e gömme → ps/reflog sızıntısı yok). actions/checkout deseni.
          # git pull hâlâ gerekli: docker-compose.prod.yml ve Caddyfile repodan okunuyor.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          # 2026-11-24: pull yerine fetch + reset. Geçmiş yeniden yazıldığında (repo public öncesi kişisel
          # veri temizliği, force push) pull "divergent branches" ile düşüyordu. Sunucuda takip edilen
          # dosyada elle değişiklik varsa SİLMEZ, durur (.env.production ve config/ git dışı, etkilenmez).
          retry git -c http.extraheader="$AUTH_HEADER" fetch origin main
          # Elle değişmiş dosya gelen sürümle birebir aynıysa (ör. repoya da işlenmiş chmod) sorun değil.
          LOCAL_ONLY=$(git diff --name-only HEAD | while read -r f; do
            git diff --quiet FETCH_HEAD -- "$f" || echo "$f"
          done)
          if [ -n "$LOCAL_ONLY" ]; then
            echo "$LOCAL_ONLY"
            echo "::error::Sunucuda takip edilen dosyalarda elle değişiklik var; deploy durduruldu, önce bunlara bak."
            exit 1
          fi
          git reset --hard FETCH_HEAD
          AFTER=$(git rev-parse HEAD)
          COMPOSE="docker compose --env-file .env.production -f docker-compose.prod.yml"
          # GHCR paketleri private → job token'ıyla giriş, çekince çıkış (token diskte kalmasın).
          retry ghcr_login
          if ! retry $COMPOSE pull api web landing; then
            docker logout ghcr.io || true
            echo "::error::İmajlar çekilemedi. Mevcut servisler çalışmaya devam ediyor."
            exit 1
          fi
          docker logout ghcr.io
          $COMPOSE up -d --no-build
          # Caddyfile bind-mount: up -d caddy'yi yeniden YARATMAZ + `caddy reload` çalışan sürece
          # uygulamayabilir → Caddyfile değiştiyse konteyneri restart et (dosyayı sıfırdan okur).
          if git diff --name-only "$BEFORE" "$AFTER" | grep -q '^Caddyfile$'; then
            echo "Caddyfile değişti → caddy restart"
            $COMPOSE restart caddy
          fi
          # Temizlik hataları deploy'u düşürmez (yalnız ön kontrol eşiği durdurur).
          docker image prune -f || true
          cleanup_old_images || true
          docker builder prune -af || true
          df -h /
