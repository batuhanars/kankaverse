# Kankaverse — PRODUCTION (VPS, tam self-host)
# Çalıştır:  docker compose --env-file .env.production -f docker-compose.prod.yml pull && ... up -d --no-build
# Acil durum (GHCR erişilemezse): ... up -d --build  → sunucuda derler
# Servisler: postgres + redis (yalnız iç ağ, host'a AÇILMAZ) · api · web (static) · caddy (edge, otomatik TLS)
# Ağır yük dışarıda: ses/video = LiveKit Cloud · dosya = R2/MinIO (UPLOADS_ENABLED açılınca)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports YOK — yalnız iç compose ağından erişilir (güvenlik). Host'tan erişim: docker compose exec.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    # ports YOK — iç ağ
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Image GitHub Actions'ta build edilip GHCR'ye itilir, VPS yalnız çeker (deploy.yml).
    # build: bloğu yerel/acil durum için duruyor: `up -d --build` hâlâ sunucuda derler.
    image: ghcr.io/batuhanars/kankaverse-api:${IMAGE_TAG:-latest}
    build:
      context: ./api
    restart: unless-stopped
    env_file: .env.production
    # Automod kelime listesi repoda değil, sunucuda `config/automod-words.json` (git dışı). Değiştirmek için
    # dosyayı düzenleyip api'yi yeniden başlat. Dosya yoksa api başlamaz (bkz. api automod-lists.ts).
    environment:
      AUTOMOD_WORDS_FILE: /app/config/automod-words.json
    volumes:
      - ./config/automod-words.json:/app/config/automod-words.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ports YOK — Caddy iç ağdan api:3000'e proxy'ler

  web:
    image: ghcr.io/batuhanars/kankaverse-web:${IMAGE_TAG:-latest}
    build:
      # E1 §6.1: context kök (web, shared/e2ee-core'u da derler)
      context: .
      dockerfile: web/Dockerfile
      args:
        # Build-time API URL — Vite gömer. Kendi domain'ine göre değiştir.
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    # ports YOK — Caddy iç ağdan web:80'e proxy'ler

  landing:
    # Tanıtım sitesi (Nuxt SSG → statik nginx). API'ye konuşmaz; CTA'lar absolute URL → build-arg yok.
    image: ghcr.io/batuhanars/kankaverse-landing:${IMAGE_TAG:-latest}
    build:
      context: ./landing
    restart: unless-stopped
    # ports YOK — Caddy iç ağdan landing:80'e proxy'ler ('/' + bilinmeyen yollar)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/downloads:ro   # masaüstü installer (VPS'te ~/kankaverse/downloads/, repo'ya girmez)
      - caddy_data:/data        # ACME sertifikaları burada kalıcı (yeniden yaratma)
      - caddy_config:/config
    depends_on:
      - web
      - api
      - landing

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
