plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.inappupdate'
version = '1.0.0'

android {
  namespace "expo.modules.inappupdate"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }

  compileOptions {
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Google Play In-App Updates (resmi kütüphane). Yalnız Play'den yüklenmiş uygulamada sonuç verir.
  implementation 'com.google.android.play:app-update:2.1.0'
}
