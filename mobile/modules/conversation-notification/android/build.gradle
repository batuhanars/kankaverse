plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.conversationnotification'
version = '1.0.0'

android {
  namespace "expo.modules.conversationnotification"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }

  compileOptions {
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  // QuickReplyService HeadlessJsTaskService'ten turer (expo-modules-core react-android'i `implementation` aldigi icin burada acik).
  compileOnly 'com.facebook.react:react-android'
  // E3 Rev.4: KvFirebaseMessagingService, expo-notifications'in (open) ExpoFirebaseMessagingService'ini genisletir.
  // `implementation project(...)` manifest birlestirmede bu modulu expo-notifications'tan USTUN yapar; boylece
  // modul manifestindeki tools:node="remove" Expo'nun servis kaydini gercekten siler. Firebase surumu expo-notifications ile ayni.
  implementation project(':expo-notifications')
  implementation 'com.google.firebase:firebase-messaging:24.0.1'
}

repositories {
  mavenCentral()
}
