plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.argon2'
version = '1.0.0'

android {
  namespace "expo.modules.argon2"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }

  compileOptions {
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Argon2'nin resmi C referansini saran kutuphane (Maven Central). Yedek anahtari turetimi (E5a §2.4).
  implementation 'com.lambdapioneer.argon2kt:argon2kt:1.6.0'
}
